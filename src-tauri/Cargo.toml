[package]
name = "countdown"
version = "0.2.0-rc.1"
description = "An always-on-top countdown timer"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "countdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# tauri-cli rewrites the `features` of `tauri` and `tauri-build` from
# tauri.conf.json on every run, turning a bare version string into this
# table. Keeping its form leaves `cargo tauri dev` with no diff.
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
