[package]
name = "countdown"
version = "0.1.1"
description = "An always-on-top countdown timer"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "countdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
# `macos-private-api` is inert on other platforms, so it stays unconditional
# rather than duplicating the whole table under a macOS target section.
tauri = { version = "2.12.5", features = ["macos-private-api"] }
