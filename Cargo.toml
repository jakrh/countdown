[package]
name = "countdown-ui"
# Never published and nothing reads it; the app version lives in
# src-tauri/Cargo.toml, which is what Tauri stamps into the bundle.
version = "0.0.0"
edition = "2021"

[dependencies]
sycamore = { version = "0.9.4", features = ["suspense"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
serde-wasm-bindgen = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
console_error_panic_hook = "0.1.7"
gloo-timers = "0.4.0"
web-sys = { version = "0.3.107", features = ["Window", "EventTarget", "KeyboardEvent", "HtmlInputElement", "Document", "Element", "HtmlElement", "InputEvent", "Storage", "Window"] }

[workspace]
members = ["countdown-core", "src-tauri"]

# Must live in the workspace root: Cargo ignores `[profile.*]` in members.
# Applies to both the wasm frontend and the Tauri binary.
[profile.release]
strip = true
lto = true
codegen-units = 1
