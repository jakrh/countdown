[package]
name = "countdown-ui"
# Never published and nothing reads it; the app version lives in
# src-tauri/Cargo.toml, which is what Tauri stamps into the bundle.
version = "0.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
sycamore = { version = "0.9", features = ["suspense"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1.7"
gloo-timers = "0.3.0"
web-sys = { version = "0.3", features = ["Window", "EventTarget", "KeyboardEvent", "HtmlInputElement", "Document", "Element", "HtmlElement", "InputEvent", "Storage", "Window"] }

[workspace]
members = ["src-tauri"]
