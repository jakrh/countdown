name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read version from Cargo.toml
        id: resolve
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -er '.packages[] | select(.name == "countdown") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: $version"

      # src-tauri/Cargo.toml is the single source of truth, so a tag that
      # disagrees with it would ship artifacts whose embedded version does
      # not match the release they are attached to.
      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v${{ steps.resolve.outputs.version }}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match src-tauri/Cargo.toml ($expected)"
            exit 1
          fi

  build:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - label: windows-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          # Triage arms, not for release. Defender's ML classifier flags every
          # Windows executable CI has produced, while builds from a local
          # machine scan clean. The rustc version and every dependency version
          # are identical across both, so each arm removes one of the few
          # remaining differences. All arms must be scanned on the same day:
          # the verdict has already been observed to change with nothing but
          # the build timestamp, so single scans carry no signal.
          - label: windows-x64-remap
            os: windows-2025
            target: x86_64-pc-windows-msvc
            remap-paths: true
          - label: windows-x64-nostrip
            os: windows-2025
            target: x86_64-pc-windows-msvc
            strip: none
          - label: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    env:
      ARTIFACT: countdown-${{ needs.version.outputs.version }}-${{ matrix.label }}
      # Mirrors Cargo.toml unless an arm overrides it; Cargo has no way to set
      # a profile key per target, so a per-platform strip has to come from here.
      CARGO_PROFILE_RELEASE_STRIP: ${{ matrix.strip || 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      # binstall records installs in .crates.toml, but rust-cache prunes
      # $CARGO_HOME/bin against .crates2.json, which binstall never writes.
      # The tools are deleted before the cache is saved, and the restored
      # .crates.toml then convinces binstall they are still installed.
      # Keyed on the label rather than the target: the two Windows arms share
      # a target triple but not a toolset, and Cargo's fingerprints do not
      # track the MSVC version, so a shared cache would hand one arm objects
      # the other arm's linker produced.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.label }}
          cache-bin: false

      - uses: cargo-bins/cargo-binstall@v1.21.1

      # Without a token these are anonymous GitHub API calls, rate limited
      # per source IP. The macOS runner pool shares few enough addresses to
      # exhaust that, and binstall answers a throttled lookup by silently
      # falling back to building from source.
      - name: Install trunk and tauri-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall --no-confirm trunk@0.21.14 tauri-cli@2.11.4

      - name: Install Linux build dependencies
        if: matrix.label == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Build macOS app bundle
        if: matrix.label == 'macos-arm64'
        run: cargo tauri build --target ${{ matrix.target }} --bundles app

      # Dependency source paths reach the executable through panic locations,
      # so a release build names the account it was built under. Reading the
      # prefixes out of the environment keeps this honest if either moves.
      - name: Remap build paths
        if: matrix.remap-paths
        shell: bash
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=$CARGO_HOME=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/src" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$CARGO_HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

      - name: Build Windows executable
        if: startsWith(matrix.label, 'windows-x64')
        run: cargo tauri build --target ${{ matrix.target }} --no-bundle

      # linuxdeploy and appimagetool are themselves AppImages, and Ubuntu 24.04
      # blocks the unprivileged user namespaces their runtime mounts through.
      # Extracting instead of mounting sidesteps it without touching sysctl.
      - name: Build Linux AppImage
        if: matrix.label == 'linux-x64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo tauri build --target ${{ matrix.target }} --bundles appimage

      # Tauri leaves the bundle with the linker's ad-hoc signature on the
      # executable but no bundle-level seal, which macOS reports as damaged.
      # Re-signing ad-hoc costs nothing and downgrades that to the ordinary
      # unidentified-developer prompt. It is not notarization.
      - name: Ad-hoc sign and package macOS app
        if: matrix.label == 'macos-arm64'
        run: |
          app=target/${{ matrix.target }}/release/bundle/macos/countdown.app
          codesign --force --deep -s - "$app"
          codesign -vvv --strict "$app"
          ditto -c -k --keepParent "$app" "$ARTIFACT.zip"

      # The toolset a runner label resolves to is not stable over time, so the
      # comparison needs the versions and the PE stamps read back out of the
      # executable this run actually produced.
      - name: Report Windows toolchain and PE metadata
        if: startsWith(matrix.label, 'windows-x64')
        shell: pwsh
        run: |
          "Runner image   : $env:ImageOS $env:ImageVersion"
          "Profile strip  : $env:CARGO_PROFILE_RELEASE_STRIP"
          "RUSTFLAGS      : $env:RUSTFLAGS"
          rustc -vV
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installs = & $vswhere -all -prerelease -products '*' -format json | ConvertFrom-Json
          foreach ($vs in $installs) {
            "$($vs.displayName) $($vs.installationVersion)"
            $default = Join-Path $vs.installationPath 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt'
            if (Test-Path $default) { "  VCTools default: " + (Get-Content $default).Trim() }
            Get-ChildItem (Join-Path $vs.installationPath 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue |
              ForEach-Object {
                $link = Join-Path $_.FullName 'bin\Hostx64\x64\link.exe'
                if (Test-Path $link) { "  toolset $($_.Name) -> link.exe $((Get-Item $link).VersionInfo.FileVersion)" }
              }
          }
          "Trunk tool cache:"
          Get-ChildItem "$env:LOCALAPPDATA\trunk" -ErrorAction SilentlyContinue | ForEach-Object { "  $($_.Name)" }

          $exe = "target/${{ matrix.target }}/release/countdown.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $stamp = [BitConverter]::ToUInt32($bytes, $pe + 8)
          "Size           : {0} bytes" -f $bytes.Length
          "SHA256         : " + (Get-FileHash $exe -Algorithm SHA256).Hash
          "Linker version : {0}.{1}" -f $bytes[$pe + 26], $bytes[$pe + 27]
          "TimeDateStamp  : 0x{0:X8} ({1:u})" -f $stamp, [DateTimeOffset]::FromUnixTimeSeconds($stamp).UtcDateTime
          "Sections:"
          $sections = $pe + 24 + [BitConverter]::ToUInt16($bytes, $pe + 20)
          foreach ($i in 0..([BitConverter]::ToUInt16($bytes, $pe + 6) - 1)) {
            $o = $sections + $i * 40
            $name = [Text.Encoding]::ASCII.GetString($bytes, $o, 8).Trim([char]0)
            "  {0,-8} raw={1,10} virt={2,10}" -f $name, [BitConverter]::ToUInt32($bytes, $o + 16), [BitConverter]::ToUInt32($bytes, $o + 8)
          }
          (Get-Item $exe).VersionInfo | Format-List CompanyName, FileDescription, FileVersion, ProductName, LegalCopyright, OriginalFilename

          # Dependency source paths survive `strip`, so the executable reports
          # the toolchain and the dependency versions it was built from. This
          # is the only way to read those back out of a binary built elsewhere.
          $text = [Text.Encoding]::GetEncoding('iso-8859-1').GetString($bytes)
          "Embedded rustc : " + [regex]::Match($text, 'rustc/[0-9a-f]{40}').Value
          "Embedded user paths:"
          [regex]::Matches($text, '[A-Za-z]:\\Users\\[A-Za-z0-9_.~-]{1,20}') |
            ForEach-Object { $_.Value } | Group-Object | Sort-Object Count -Descending |
            ForEach-Object { "  $($_.Name) x$($_.Count)" }
          "Embedded crate versions:"
          [regex]::Matches($text, 'index\.crates\.io-[0-9a-f]{16}\\([A-Za-z0-9_.+-]+?)-(\d+\.\d+\.\d+[A-Za-z0-9.+-]*)\\') |
            ForEach-Object { "$($_.Groups[1].Value) $($_.Groups[2].Value)" } |
            Sort-Object -Unique | ForEach-Object { "  $_" }

      - name: Package Windows executable
        if: startsWith(matrix.label, 'windows-x64')
        shell: bash
        run: 7z a "$ARTIFACT.7z" "./target/${{ matrix.target }}/release/countdown.exe"

      - name: Package Linux AppImage
        if: matrix.label == 'linux-x64'
        run: |
          src=$(find target/${{ matrix.target }}/release/bundle/appimage -name '*.AppImage' -print -quit)
          [ -n "$src" ] || { echo "::error::No AppImage produced"; exit 1; }
          mv "$src" "$ARTIFACT.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}.zip
            ${{ env.ARTIFACT }}.7z
            ${{ env.ARTIFACT }}.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Write release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Downloads

          | Platform | File |
          | --- | --- |
          | macOS (Apple Silicon) | \`countdown-$VERSION-macos-arm64.zip\` |
          | Windows (x64) | \`countdown-$VERSION-windows-x64.7z\` |
          | Linux (x64) | \`countdown-$VERSION-linux-x64.AppImage\` |

          ## macOS

          The build is ad-hoc signed but not notarized, so macOS refuses
          to open it until the quarantine flag is cleared:

          \`\`\`
          xattr -dr com.apple.quarantine <path to countdown.app>
          \`\`\`

          Dragging the app onto the Terminal window fills in the path.

          ## Windows

          The executable is unsigned, so SmartScreen blocks the first
          launch. Choose **More info**, then **Run anyway**.

          ## Linux

          \`chmod +x\` the AppImage and run it. Built against glibc 2.39,
          so it needs Ubuntu 24.04 or a comparably recent distribution.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            artifacts/*
