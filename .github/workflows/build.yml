name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
  # Tag and pull request runs ignore these and build every platform, so a
  # release never misses one.
  workflow_dispatch:
    inputs:
      macos:
        description: macOS (arm64)
        type: boolean
        default: true
      windows:
        description: Windows (x64)
        type: boolean
        default: true
      linux:
        description: Linux (x64)
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      notes: ${{ steps.resolve.outputs.notes }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      # The build matrix is computed because a static one cannot drop a
      # platform: `include` runs after `exclude` and re-adds what it
      # removed. Without inputs (tag and pull request runs) all are kept.
      # An empty list is refused here, since an empty matrix fails with an
      # opaque error.
      - name: Choose platforms
        id: platforms
        env:
          MACOS: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}
          WINDOWS: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
          LINUX: ${{ github.event_name != 'workflow_dispatch' || inputs.linux }}
        run: |
          jq -rn --argjson macos "$MACOS" --argjson windows "$WINDOWS" --argjson linux "$LINUX" '
            [
              {label: "macos-arm64", os: "macos-15", target: "aarch64-apple-darwin", wanted: $macos},
              {label: "windows-x64", os: "windows-2025", target: "x86_64-pc-windows-msvc", wanted: $windows},
              {label: "linux-x64", os: "ubuntu-24.04", target: "x86_64-unknown-linux-gnu", wanted: $linux}
            ]
            | map(select(.wanted) | del(.wanted))
            | if length == 0 then error("Select at least one platform") end
            | "platforms=\(tojson)"
          ' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Read version from Cargo.toml
        id: resolve
        run: |
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -er '.packages[] | select(.name == "countdown") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=docs/releases/$version.md" >> "$GITHUB_OUTPUT"
          echo "Resolved app version: $version"

      # src-tauri/Cargo.toml is the single source of truth, so a tag that
      # disagrees with it would ship artifacts whose embedded version does
      # not match the release they are attached to.
      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          expected="v$VERSION"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match src-tauri/Cargo.toml ($expected)"
            exit 1
          fi

      # Release notes are committed so they are reviewed like the code they
      # describe. A tag without them fails here rather than after the builds.
      - name: Verify release notes exist
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NOTES: ${{ steps.resolve.outputs.notes }}
        run: |
          if [ ! -s "$NOTES" ]; then
            echo "::error::Missing or empty $NOTES"
            exit 1
          fi

  build:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.platforms) }}
    env:
      ARTIFACT: countdown-${{ needs.version.outputs.version }}-${{ matrix.label }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      # binstall records installs in .crates.toml, but rust-cache prunes
      # $CARGO_HOME/bin against .crates2.json, which binstall never writes.
      # The tools are deleted before the cache is saved, and the restored
      # .crates.toml then convinces binstall they are still installed.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}
          cache-bin: false

      - uses: cargo-bins/cargo-binstall@v1.26.2

      # Without a token these are anonymous GitHub API calls, rate limited
      # per source IP. The macOS runner pool shares few enough addresses to
      # exhaust that, and binstall answers a throttled lookup by silently
      # falling back to building from source.
      - name: Install trunk and tauri-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall --no-confirm trunk@0.22.1 tauri-cli@2.12.4

      - name: Install Linux build dependencies
        if: matrix.label == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Build macOS app bundle
        if: matrix.label == 'macos-arm64'
        run: cargo tauri build --target ${{ matrix.target }} --bundles app

      - name: Build Windows executable
        if: matrix.label == 'windows-x64'
        run: cargo tauri build --target ${{ matrix.target }} --no-bundle

      # linuxdeploy and appimagetool are themselves AppImages, and Ubuntu 24.04
      # blocks the unprivileged user namespaces their runtime mounts through.
      # Extracting instead of mounting sidesteps it without touching sysctl.
      - name: Build Linux AppImage
        if: matrix.label == 'linux-x64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo tauri build --target ${{ matrix.target }} --bundles appimage

      # Tauri leaves the bundle with the linker's ad-hoc signature on the
      # executable but no bundle-level seal, which macOS reports as damaged.
      # Re-signing ad-hoc costs nothing and downgrades that to the ordinary
      # unidentified-developer prompt. It is not notarization.
      - name: Ad-hoc sign and package macOS app
        if: matrix.label == 'macos-arm64'
        run: |
          app=target/${{ matrix.target }}/release/bundle/macos/countdown.app
          codesign --force --deep -s - "$app"
          codesign -vvv --strict "$app"
          ditto -c -k --keepParent "$app" "$ARTIFACT.zip"

      - name: Package Windows executable
        if: matrix.label == 'windows-x64'
        shell: bash
        run: 7z a -tzip "$ARTIFACT.zip" "./target/${{ matrix.target }}/release/countdown.exe"

      - name: Package Linux AppImage
        if: matrix.label == 'linux-x64'
        run: |
          src=$(find target/${{ matrix.target }}/release/bundle/appimage -name '*.AppImage' -print -quit)
          [ -n "$src" ] || { echo "::error::No AppImage produced"; exit 1; }
          mv "$src" "$ARTIFACT.AppImage"

      # Each job leaves exactly one file, already packaged, so it is
      # uploaded as is: a zipped artifact wrapped the Windows and macOS
      # zips in a second zip. Unzipped artifacts take the file's name.
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: |
            ${{ env.ARTIFACT }}.zip
            ${{ env.ARTIFACT }}.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [version, build]
    # A manual run started on a tag may build only some platforms, so only
    # a tag push publishes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # gh authenticates with GH_TOKEN, so the job's write token need not
      # be left in the checkout's git config.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Without skip-decompress, the zips uploaded as is would be unpacked
      # here, since the action detects a zip by its content type.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          skip-decompress: true

      # An unzipped artifact is saved under the name the download server
      # reports. Without one, every file would land as `artifact` and
      # overwrite the others, and the release would get a single asset.
      - name: Check asset names
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l artifacts
          for f in artifacts/*; do
            case "${f##*/}" in
              "countdown-$VERSION-"*) ;;
              *) echo "::error::Unexpected asset $f"; exit 1 ;;
            esac
          done

      - name: Write release body
        env:
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          { cat "$NOTES"; printf '\n\n---\n\n'; } > body.md
          cat >> body.md <<EOF
          ## Downloads

          | Platform | File |
          | --- | --- |
          | macOS (Apple Silicon) | \`countdown-$VERSION-macos-arm64.zip\` |
          | Windows (x64) | \`countdown-$VERSION-windows-x64.zip\` |
          | Linux (x64) | \`countdown-$VERSION-linux-x64.AppImage\` |

          ## macOS

          The build is ad-hoc signed but not notarized, so macOS refuses
          to open it until the quarantine flag is cleared:

          \`\`\`
          xattr -dr com.apple.quarantine <path to countdown.app>
          \`\`\`

          Dragging the app onto the Terminal window fills in the path.

          ## Windows

          The executable is unsigned, so SmartScreen blocks the first
          launch. Choose **More info**, then **Run anyway**.

          ## Linux

          \`chmod +x\` the AppImage and run it. Built against glibc 2.39,
          so it needs Ubuntu 24.04 or a comparably recent distribution.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file body.md \
            artifacts/*
